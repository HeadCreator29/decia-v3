# OpenSpec Configuration for DECIA_V3
# Generated by sdd-init

project:
  name: "DECIA_V3"
  description: "Python voice assistant with faster-whisper STT, custom pattern-based intent classification, JSON file archive, Ollama LLM fallback, pyttsx3 TTS"
  root: "/mnt/c/Users/idelv/Desktop/DECIA_V3"
  language: "python"
  version: "3.14"

stack:
  runtime: "python"
  version: "3.14"
  dependencies:
    - "faster-whisper"
    - "sounddevice"
    - "numpy"
    - "pyttsx3"
    - "ollama (via HTTP API)"
  architecture:
    pattern: "modular"
    layers:
      - "voice (STT/TTS)"
      - "brain (intent classification, routing, handlers)"
      - "services (archive, ollama, planner)"
      - "utils (normalizer, date_parser, math_eval, speech_corrections)"
      - "personality"

testing:
  framework: "pytest"
  runner_available: false
  strict_tdd: true
  test_directories:
    - "tests/"
    - "app/"
  test_patterns:
    - "test_*.py"
  layers:
    unit: true
    integration: false
    e2e: false
  coverage:
    enabled: false
    target: 0
  lint:
    enabled: false
    tools: []
  type_check:
    enabled: false
    tool: "none"
  formatter:
    enabled: false
    tool: "none"

persistence:
  mode: "hybrid"
  engram:
    project_key: "DECIA_V3"
    namespace: "sdd"
  openspec:
    path: "openspec/"

conventions:
  naming:
    functions: "snake_case"
    classes: "PascalCase"
    constants: "UPPER_SNAKE_CASE"
    files: "snake_case.py"
  imports:
    style: "absolute_from_app_root"
    example: "from brain.intent_layer import IntentLayer"
  logging:
    prefix: "[DECIA <MODULE>]"
    levels: ["INFO", "DEBUG", "ERROR"]
  intent_classification:
    type: "pattern_based"
    confidence_thresholds:
      seguro: 0.90
      probable: 0.70
      ambiguo: 0.50
  archive:
    format: "json"
    files:
      - "identity.json"
      - "history.json"
      - "memories.json"
      - "planner.json"
      - "user.json"
  planner:
    storage: "planner.json"
    atomic_writes: true
    deduplication: "exact_by_kind_date_time_desc"

skills:
  registry_path: ".atl/skill-registry.md"
  auto_discover: true